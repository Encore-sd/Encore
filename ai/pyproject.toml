[project]
name = "ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "silero-vad>=6.2.3",
    "torch>=2.8.0",
    "transformers>=4.57.6",
    "typesafe-sdk>=0.7.5",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "nbstripout>=0.8.2",
    "pytest>=8.4.2",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
