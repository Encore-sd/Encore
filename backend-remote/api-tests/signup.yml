info:
  name: signup
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/auth/signup"
  body:
    type: json
    data: |-
      {
        "firstName": "Test",
        "lastName": "User",
        "email": "[email]",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Registering the same login twice returns 409, so make each run unique
        bru.setVar("newLogin", `student${Date.now()}`);
        bru.setVar("newPassword", "Passw0rd!");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates a new account. Does not change the logged-in user for the requests that follow.
