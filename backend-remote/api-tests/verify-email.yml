info:
  name: verify-email
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "verificationCode": "649013"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        bru.setVar("token", res.getBody().token);
        bru.setVar("userid", res.getBody().userid);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates a new account. Does not change the logged-in user for the requests that follow.
