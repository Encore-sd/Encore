info:
  name: verify-email
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseURL}}/auth/verify-email"
  body:
    type: json
    data: |-
      {
        "email": "[email]",
        "verificationCode": "[verificationCode]"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Registering the same login twice returns 409, so make each run unique
        bru.setVar("newLogin", `student${Date.now()}`);
        bru.setVar("newPassword", "Passw0rd!");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates a new account. Does not change the logged-in user for the requests that follow.
