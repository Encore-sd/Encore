info:
  name: Delete a memory copy
  type: http
  seq: 11

http:
  method: DELETE
  url: "{{baseURL}}/account/{{userid}}"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: ""
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Registering the same login twice returns 409, so make each run unique
        bru.setVar("newLogin", `student${Date.now()}`);
        bru.setVar("newPassword", "Passw0rd!");

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates a new account. Does not change the logged-in user for the requests that follow.
