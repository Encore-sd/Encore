info:
  name: submit user query
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseURL}}/query"
  headers:
    - name: Authorization
      value: Bearer {{token}}
  body:
    type: json
    data: |-
      {
        "query": "Where did I leave my keys?"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Creates a new account. Does not change the logged-in user for the requests that follow.
