services:
  backend:
    build: ./backend
    container_name: encore_backend
    restart: always
    ports:
      - "${APP_PORT:-5000}:${APP_PORT:-5000}"
    environment:
      - NODE_ENV=development
      - PORT=${APP_PORT:-5000}
      - DB_HOST=postgres_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres_db
    networks:
      - app-network

  postgres_db:
    image: postgres:16-alpine
    container_name: encore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
