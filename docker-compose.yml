services:
  backend-local:
    build: ./backend-local
    container_name: encore_backend_local
    restart: always
    ports:
      - "${LOCAL_BACKEND_PORT:-5000}:${LOCAL_BACKEND_PORT:-5000}" # Maps the port on your machine to the port in the container
    environment:
      - NODE_ENV=development
      - PORT=${LOCAL_BACKEND_PORT:-5000}
      - REMOTE_BACKEND_URL=http://backend-remote:${REMOTE_BACKEND_PORT:-5001}
      - SQLITE_PATH=/app/sqlite-data/local.db
    volumes:
      - ./backend-local:/app
      - /app/node_modules
      - ./sqlite-data:/app/sqlite-data
    networks:
      - app-network

  backend-remote:
    build: ./backend-remote
    container_name: encore_backend_remote
    restart: always
    ports:
      - "${REMOTE_BACKEND_PORT:-5001}:${REMOTE_BACKEND_PORT:-5001}" # Maps the port on your machine to the port in the container
    environment:
      - NODE_ENV=development
      - PORT=${REMOTE_BACKEND_PORT:-5001}
      - DB_HOST=postgres_db
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - DB_PORT=${DB_PORT:-5432}
    volumes:
      - ./backend-remote:/app
      - /app/node_modules
    depends_on:
      - postgres_db
    networks:
      - app-network

  postgres_db:
    image: postgres:16-alpine
    container_name: encore_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d
    networks:
      - app-network

  frontend:
      build: ./frontend
      container_name: encore_frontend
      restart: always
      ports:
        - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}" # Maps the port on your machine to the port in the container
      volumes:
        - ./frontend:/app
        - /app/node_modules # Prevents local node_modules from overwriting container's modules
      environment:
        - VITE_API_URL=http://localhost:${BACKEND_PORT:-5000} # Pointing to your backend
      networks:
        - app-network
    
volumes:
  postgres_data:


networks:
  app-network:
    driver: bridge
