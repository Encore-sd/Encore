info:
  name: RemoteBackendHealthCheck
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseURL}}/health/remote"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("reports the remote backend as connected", function () {
          expect(body.status).to.equal("connected");
        });

        test("includes the remote URL and its response", function () {
          expect(body.remoteUrl).to.be.a("string");
          expect(body.responseMessage).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Checks that the local backend can reach the remote backend. Fails with 502 or 503 if the remote backend is down or unreachable.
