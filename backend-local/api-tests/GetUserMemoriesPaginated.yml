info:
  name: GetUserMemoriesPaginated
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseURL}}/memories/1?page=2&limit=500"
  params:
    - name: page
      value: "2"
      type: query
    - name: limit
      value: "500"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("honors the requested page", function () {
          expect(body.pagination.page).to.equal(2);
          expect(body.pagination.hasPrevPage).to.equal(true);
        });

        test("caps limit at 100", function () {
          expect(body.pagination.limit).to.equal(100);
          expect(body.memories.length).to.be.at.most(100);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Requests page 2 with an oversized limit to check that paging works and limit is capped at 100.
