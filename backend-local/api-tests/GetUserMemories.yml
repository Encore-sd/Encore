info:
  name: GetUserMemories
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseURL}}/memories/1"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 OK", function () {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns a memories array", function () {
          expect(body.success).to.equal(true);
          expect(body.memories).to.be.an("array");
        });

        test("only returns memories for the requested user", function () {
          body.memories.forEach(function (memory) {
            expect(memory.UserID).to.equal(1);
          });
        });

        test("uses default pagination", function () {
          expect(body.pagination.page).to.equal(1);
          expect(body.pagination.limit).to.equal(20);
          expect(body.pagination.hasPrevPage).to.equal(false);
          expect(body.memories.length).to.be.at.most(20);
        });

        test("pagination totals are consistent", function () {
          const p = body.pagination;
          expect(p.totalItems).to.be.a("number");
          expect(p.totalPages).to.equal(Math.ceil(p.totalItems / p.limit));
          expect(p.hasNextPage).to.equal(p.page < p.totalPages);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Fetches the locally stored memories for user 1 with default pagination. Passes with an empty database.
