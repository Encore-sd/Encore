info:
  name: GetUserMemoriesInvalidId
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseURL}}/memories/abc"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 400 Bad Request", function () {
          expect(res.getStatus()).to.equal(400);
        });

        test("returns an error message", function () {
          expect(body.success).to.equal(false);
          expect(body.error).to.be.a("string");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

docs: Sends a non-numeric user ID to check that the route rejects it with a 400.
